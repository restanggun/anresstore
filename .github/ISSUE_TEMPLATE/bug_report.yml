name: Laporan bug
description: Laporkan masalah yang dapat direproduksi
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Langkah reproduksi dan hasil aktual
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Hasil yang diharapkan
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Lingkungan
      description: Versi Node, OS, browser. Jangan sertakan token atau data pelanggan.
