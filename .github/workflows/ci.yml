name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_WEB_URL: https://anresstore.site
      NEXT_PUBLIC_AUTH_URL: https://auth.anresstore.site
      NEXT_PUBLIC_APP_URL: https://app.anresstore.site
      NEXT_PUBLIC_ADMIN_URL: https://admin.anresstore.site
      NEXT_PUBLIC_API_URL: https://api.anresstore.site/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - run: npm run typecheck
      - name: Build API for tests
        run: npm run build --workspace=@anres/api
      - name: Run API tests with diagnostic output
        run: node --test --test-reporter=spec apps/api/test/*.test.mjs
      - run: npm run test:web
      - run: npm run test:db
      - run: npm run build

  deploy:
    name: Deploy production VPS
    needs: validate
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.VPS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: anres-production-deploy
      cancel-in-progress: false
    steps:
      - name: Load VPS SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Trust VPS host key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '[202.155.143.177]:32127 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGsDdKagNjzm8YzcqMewoBKcS+1tvNBMKvQNIvZnYVJd' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy through restricted VPS key
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: ssh -p 32127 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 root@202.155.143.177 deploy "$RELEASE_SHA"
      - name: Check production routes
        run: |
          for url in https://anresstore.site/ https://app.anresstore.site/katalog https://admin.anresstore.site/ https://api.anresstore.site/v1/health; do
            curl --fail --silent --show-error --connect-timeout 10 --max-time 20 --retry 8 --retry-delay 5 --retry-all-errors "$url" --output /dev/null
          done
