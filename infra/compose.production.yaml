name: anres-production
x-runtime: &runtime
  init: true
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
x-public: &public
  NEXT_PUBLIC_WEB_URL: https://anresstore.site
  NEXT_PUBLIC_AUTH_URL: https://auth.anresstore.site
  NEXT_PUBLIC_APP_URL: https://app.anresstore.site
  NEXT_PUBLIC_ADMIN_URL: https://admin.anresstore.site
  NEXT_PUBLIC_API_URL: https://api.anresstore.site/v1
services:
  edge:
    <<: *runtime
    image: caddy:2-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        ipv4_address: 172.30.50.2
    depends_on: [web, admin, api]
    restart: unless-stopped
  web:
    <<: *runtime
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        <<: *public
        APP: web
    environment: *public
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/', {headers: {host: 'anresstore.site'}, redirect: 'error', signal: AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
  admin:
    <<: *runtime
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        <<: *public
        APP: admin
    environment: *public
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/', {headers: {host: 'admin.anresstore.site'}, redirect: 'error', signal: AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
  api:
    <<: *runtime
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        APP: api
    env_file: ../apps/api/.env.production
    environment:
      PORT: 4000
      AUTH_WEB_ORIGIN: https://anresstore.site
      AUTH_AUTH_ORIGIN: https://auth.anresstore.site
      AUTH_APP_ORIGIN: https://app.anresstore.site
      AUTH_ADMIN_ORIGIN: https://admin.anresstore.site
      AUTH_API_ORIGIN: https://api.anresstore.site
      CORS_ORIGINS: https://anresstore.site,https://auth.anresstore.site,https://app.anresstore.site,https://admin.anresstore.site
      ADMIN_ALLOWED_ORIGINS: https://admin.anresstore.site
      TRUST_PROXY_CIDRS: 172.30.50.2/32
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/v1/health', {signal: AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.50.0/24
volumes:
  caddy_data:
  caddy_config:
